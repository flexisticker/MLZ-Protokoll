# Nur als Referenz (Unraid: Vorlage unraid/mlz-protokoll.xml – siehe docs/INSTALLATION-UNRAID.md)
services:
  mlz-protokoll:
    image: ghcr.io/flexisticker/mlz-protokoll:latest
    container_name: mlz-protokoll
    restart: unless-stopped
    ports: ["8094:8090"]
    environment:
      - TZ=Europe/Berlin
    volumes:
      - /mnt/user/appdata/mlz-protokoll:/data
      # Whisper-Modelle der Video-Zentrale mitbenutzen (nur lesend)
      - /mnt/user/appdata/video-zentrale/whisper:/models:ro
